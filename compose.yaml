name: url-shortener

x-backend: &backend
    build: ./backend
    image: url-shortener-backend
    volumes:
        - ./backend:/var/www/html
    environment: &backend-env
        DB_CONNECTION: mysql
        DB_HOST: db
        DB_PORT: 3306
        DB_DATABASE: url_shortener
        DB_USERNAME: app
        DB_PASSWORD: secret

services:
    db:
        image: mysql:9.7
        environment:
            MYSQL_RANDOM_ROOT_PASSWORD: "yes"
            MYSQL_DATABASE: url_shortener
            MYSQL_USER: app
            MYSQL_PASSWORD: secret
        volumes:
            - db-data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        ports:
            - "127.0.0.1:3306:3306"
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
            interval: 5s
            timeout: 5s
            retries: 30

    app:
        <<: *backend
        environment:
            <<: *backend-env
            RUN_SETUP: "true"
        ports:
            - "127.0.0.1:8000:8000"
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
            interval: 5s
            timeout: 5s
            retries: 60

    queue:
        <<: *backend
        command: ["php", "artisan", "queue:work"]
        depends_on:
            app:
                condition: service_healthy

    frontend:
        build: ./frontend
        environment:
            API_PROXY_TARGET: http://app:8000
            VITE_USE_POLLING: "true"
        volumes:
            - ./frontend:/app
            - frontend-node-modules:/app/node_modules
            # API型の生成（npm run generate:api）で ../backend/openapi.json を参照する
            - ./backend/openapi.json:/backend/openapi.json:ro
        ports:
            - "127.0.0.1:5173:5173"
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
            interval: 5s
            timeout: 5s
            retries: 60

volumes:
    db-data:
    frontend-node-modules:
